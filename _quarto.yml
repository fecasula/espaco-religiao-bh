project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "es/*.qmd"
  resources:
    - assets/publication/**
    - assets/img/**

website:
  title: "Espaço, religião e mobilidade em Belo Horizonte"
  site-url: "https://fecasula.github.io/espaco-religiao-bh"
  repo-url: "https://github.com/fecasula/espaco-religiao-bh"
  page-navigation: true
  reader-mode: true
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: Início
      - href: estudo.qmd
        text: Estudo
      - href: resultados.qmd
        text: Resultados
      - href: indice-cobertura.qmd
        text: ICR interativo
      - href: reprodutibilidade.qmd
        text: Reproduzir
      - href: apresentacao-pt.qmd
        text: Apresentação PT
      - href: es/presentacion-es.qmd
        text: Presentación ES
      - href: referencias.qmd
        text: Referências
    right:
      - href: index.qmd
        text: PT
      - href: es/index.qmd
        text: ES
      - icon: github
        href: "https://github.com/fecasula/espaco-religiao-bh"
        aria-label: "Repositório no GitHub"
  page-footer:
    left: "© 2026 Casula e Prado — código sob licença MIT."
    center: "Contato: felipe.baeta.pereira@gmail.com · danielpimentadeprado@gmail.com"
    right: "Painel interativo: <https://fecasula.shinyapps.io/religiao-mobilidade-bh/>"

bibliography: bibliography/references.bib
csl: bibliography/abnt.csl
lang: pt-BR

format:
  html:
    theme:
      light: [cosmo, assets/css/site.scss]
      dark: [darkly, assets/css/site.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    anchor-sections: true
    code-fold: true
    code-tools: true
    code-copy: true
    smooth-scroll: true
    link-external-newwindow: true
    fig-align: center
    fig-cap-location: bottom
    tbl-cap-location: top
    grid:
      sidebar-width: 260px
      body-width: 980px
      margin-width: 260px

execute:
  freeze: auto
  warning: false
  message: false
  echo: false
