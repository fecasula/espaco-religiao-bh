name: R checks
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::readr, any::stringr, any::here, any::sf, any::dplyr, any::purrr, any::tibble, any::tidyr, any::rlang, any::yaml, any::jsonlite
      - name: Run tests
        run: Rscript tests/testthat.R
